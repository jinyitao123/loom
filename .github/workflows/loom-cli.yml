name: loom-cli

# Quality gates for the loom CLI (cmd/loom) — the weave-daemon spawn-harness
# backend. Scoped to ./cmd/loom/... so it does not lint the rest of the repo.
on:
  push:
    paths:
      - "cmd/loom/**"
      - ".golangci.yml"
      - ".github/workflows/loom-cli.yml"
  pull_request:
    paths:
      - "cmd/loom/**"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build
        run: go build ./cmd/loom/
      - name: test -race + coverage
        run: go test -race -covermode=atomic -coverprofile=cover.out ./cmd/loom/
      - name: coverage gate (>=85%)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "coverage: ${pct}%"
          awk "BEGIN{exit !($pct >= 85)}" || { echo "coverage ${pct}% < 85%"; exit 1; }

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: fuzz the protocol invariants (short)
        run: |
          for t in FuzzEmitterAlwaysValidNDJSON FuzzParsePrompt FuzzRunAgentNeverPanics FuzzMCPDispatchParse; do
            go test ./cmd/loom/ -run '^$' -fuzz "$t" -fuzztime 20s
          done

  lint:
    name: lint + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l cmd/loom/)"
      - name: go vet
        run: go vet ./cmd/loom/
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./cmd/loom/
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -quiet ./cmd/loom/
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: ./cmd/loom/...
